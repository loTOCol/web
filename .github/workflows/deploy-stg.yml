name: deploy
on:
  push:
    paths:
      - ".github/workflows/**"
      - 'backend/src/**'
      - 'backend/build.gradle'
      - 'backend/settings.gradle'
      - 'backend/Dockerfile.stg'
    branches:
      - main

jobs:
  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: application-secret 추가
        env:
          ACTIONS_STEP_DEBUG: true
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          mkdir -p backend/src/main/resources
          printf '%s' "$APPLICATION_SECRET" > backend/src/main/resources/application-secret.yml
      
      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v2
      
      - name: 레지스트리 로그인
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"
      
      - name: 빌드 앤 푸시 (latest 태그만)
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          file: ./backend/Dockerfile.stg 
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/backend-deploy:latest  # 태그 제거, latest만
