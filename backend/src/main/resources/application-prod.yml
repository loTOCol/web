# 실제 배포중인 운영 서버에 대한 설정
#application-prod.yml
spring:
  config:
    import: "optional:classpath:application-secret.yml"

  datasource:
    #url: jdbc:mysql://localhost:3306/myweb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: jdbc:mysql://mysql-1:3306/myweb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
